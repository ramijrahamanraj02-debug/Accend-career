<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="35%" stop-color="#0a101b" />
      <stop offset="70%" stop-color="#060910" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Floor Radial Reflection -->
    <radialGradient id="floor-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e2f4a" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0d1728" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#03060c" stop-opacity="0" />
    </radialGradient>

    <!-- Compass Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2f5ff" stop-opacity="1" />
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Brass Rings -->
    <linearGradient id="gold-ring-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="gold-ring-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Cyan Glow Ribbon -->
    <linearGradient id="cyan-ribbon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="1" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="1" />
    </linearGradient>

    <!-- Glowing Chevron Pathway (Foreground) -->
    <linearGradient id="chevron-path-grad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Branching Arrow Gradients -->
    <linearGradient id="arrow-grad-center" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="arrow-grad-left" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="arrow-grad-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95" />
    </linearGradient>

    <!-- Blur Filters for Glow Effects -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ambient-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- 1. Background Chamber & Atmospheric Environment -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Perimeter Architectural Pillars & Ceiling Dome Arch -->
  <path d="M 0 0 L 1920 0 L 1920 300 Q 960 180 0 300 Z" fill="#04060c" opacity="0.85" />
  <!-- Left Column -->
  <rect x="60" y="0" width="160" height="420" fill="#070a13" />
  <rect x="75" y="0" width="20" height="420" fill="#0c1220" opacity="0.6" />
  <rect x="185" y="0" width="20" height="420" fill="#0c1220" opacity="0.6" />
  <!-- Far Left Wall Silhouette -->
  <path d="M 0 240 Q 250 140 380 280 L 380 440 L 0 460 Z" fill="#05070e" opacity="0.7" />

  <!-- Right Columns -->
  <rect x="1700" y="0" width="160" height="420" fill="#070a13" />
  <rect x="1715" y="0" width="20" height="420" fill="#0c1220" opacity="0.6" />
  <rect x="1825" y="0" width="20" height="420" fill="#0c1220" opacity="0.6" />

  <!-- Distant Wall Subtle Rim Lights -->
  <path d="M 120 340 Q 960 210 1800 340" stroke="#1e293b" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M 280 260 Q 960 160 1640 260" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 16" fill="none" opacity="0.25" />

  <!-- 2. Dark Polished Marble Floor with Inlay Perspective -->
  <ellipse cx="960" cy="520" rx="900" ry="380" fill="url(#floor-glow)" />

  <!-- Floor Concentric Geometric Inlays -->
  <ellipse cx="960" cy="510" rx="820" ry="290" stroke="#0f1d33" stroke-width="3" fill="none" />
  <ellipse cx="960" cy="510" rx="680" ry="230" stroke="#172b4a" stroke-width="2" fill="none" />
  <ellipse cx="960" cy="510" rx="540" ry="175" stroke="#1e3a63" stroke-width="2.5" fill="none" />
  <ellipse cx="960" cy="510" rx="420" ry="135" stroke="#25487a" stroke-width="3" fill="none" />

  <!-- Subtle Perspective Seams on Marble Floor -->
  <line x1="960" y1="510" x2="160" y2="920" stroke="#0e1b2e" stroke-width="2" />
  <line x1="960" y1="510" x2="380" y2="1080" stroke="#0e1b2e" stroke-width="2" />
  <line x1="960" y1="510" x2="1760" y2="920" stroke="#0e1b2e" stroke-width="2" />

  <!-- 3. Branching Career Trajectories (Arrows Spreading Out Forward) -->
  <!-- Ambient bloom behind branching arrows -->
  <g filter="url(#ambient-bloom)">
    <path d="M 960 450 Q 960 280 1480 200" stroke="#38bdf8" stroke-width="60" fill="none" opacity="0.25" />
    <path d="M 960 450 Q 960 260 1280 170" stroke="#bae6fd" stroke-width="70" fill="none" opacity="0.3" />
    <path d="M 960 450 Q 960 280 1080 190" stroke="#ffffff" stroke-width="50" fill="none" opacity="0.3" />
    <path d="M 960 450 Q 860 300 780 230" stroke="#38bdf8" stroke-width="50" fill="none" opacity="0.2" />
  </g>

  <!-- Sharp Glowing Branching Arrow Ribbons -->
  <!-- Far Right Branch -->
  <path d="M 1020 460 Q 1160 380 1620 230" stroke="url(#arrow-grad-right)" stroke-width="18" fill="none" stroke-linecap="round" />
  <polygon points="1620,230 1570,225 1595,250" fill="#bae6fd" />

  <!-- Mid Right Branch 1 -->
  <path d="M 1000 450 Q 1120 340 1520 185" stroke="url(#arrow-grad-right)" stroke-width="26" fill="none" stroke-linecap="round" />
  <polygon points="1520,185 1460,180 1490,215" fill="#ffffff" />

  <!-- Mid Right Branch 2 (Main Illuminated Arrow) -->
  <path d="M 980 440 Q 1060 300 1380 165" stroke="url(#arrow-grad-center)" stroke-width="34" fill="none" stroke-linecap="round" filter="url(#glow-soft)" />
  <polygon points="1380,165 1310,165 1345,210" fill="#ffffff" />

  <!-- Center Arrow (Straight Trajectory) -->
  <path d="M 960 430 Q 990 280 1180 190" stroke="url(#arrow-grad-center)" stroke-width="28" fill="none" stroke-linecap="round" filter="url(#glow-soft)" />
  <polygon points="1180,190 1120,195 1150,230" fill="#ffffff" />

  <!-- Left Center Arrow -->
  <path d="M 930 440 Q 880 320 1040 235" stroke="url(#arrow-grad-left)" stroke-width="22" fill="none" stroke-linecap="round" />
  <polygon points="1040,235 990,240 1015,270" fill="#bae6fd" />

  <!-- Left Curve Arrow -->
  <path d="M 910 460 Q 780 360 720 250" stroke="url(#arrow-grad-left)" stroke-width="16" fill="none" stroke-linecap="round" />
  <polygon points="720,250 760,280 735,295" fill="#7dd3fc" />

  <!-- Far Left Branch -->
  <path d="M 880 470 Q 720 390 600 300" stroke="url(#arrow-grad-left)" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8" />
  <polygon points="600,300 635,325 615,340" fill="#38bdf8" />


  <!-- 4. Giant Circular Floor Compass Dial Platform -->
  <!-- Outer Rim Shadow & Step -->
  <ellipse cx="960" cy="510" rx="380" ry="120" fill="#070c17" stroke="#0f223d" stroke-width="6" />
  <ellipse cx="960" cy="505" rx="360" ry="112" fill="#0b1322" stroke="#1d3557" stroke-width="4" />

  <!-- Illuminated Segmented Track Ring (Light Blue & White Panels) -->
  <ellipse cx="960" cy="500" rx="335" ry="104" fill="none" stroke="#2a4365" stroke-width="24" stroke-dasharray="14 4" />
  <ellipse cx="960" cy="500" rx="335" ry="104" fill="none" stroke="#60a5fa" stroke-width="20" stroke-dasharray="28 8" opacity="0.85" filter="url(#glow-soft)" />
  <ellipse cx="960" cy="500" rx="335" ry="104" fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="40 16" opacity="0.9" />

  <!-- Compass Cardinal Direction Points (Triangles on the floor dial) -->
  <polygon points="960,370 945,410 975,410" fill="#fef08a" /> <!-- North Point -->
  <polygon points="960,610 948,575 972,575" fill="#b45309" /> <!-- South Point -->
  <polygon points="1310,500 1260,490 1260,510" fill="#fef08a" /> <!-- East Point -->
  <polygon points="610,500 660,490 660,510" fill="#fde047" /> <!-- West Point -->
  <!-- Diagonal Cardinal Points -->
  <polygon points="1210,420 1175,425 1190,445" fill="#ca8a04" />
  <polygon points="710,420 745,425 730,445" fill="#ca8a04" />
  <polygon points="1210,570 1175,565 1190,545" fill="#ca8a04" />
  <polygon points="710,570 745,565 730,545" fill="#ca8a04" />

  <!-- Inner Compass Tier 2 -->
  <ellipse cx="960" cy="495" rx="240" ry="75" fill="#09111e" stroke="url(#gold-ring-1)" stroke-width="5" />
  <!-- Inner Cyan Glowing Track -->
  <ellipse cx="960" cy="492" rx="200" ry="62" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="10 6" opacity="0.9" filter="url(#glow-soft)" />

  <!-- Compass Core Dial Base -->
  <ellipse cx="960" cy="488" rx="140" ry="44" fill="#050a12" stroke="#ffffff" stroke-width="3" />


  <!-- 5. 3D Gyroscope / Armillary Sphere Centerpiece -->
  <!-- Ambient Core Bloom -->
  <ellipse cx="960" cy="410" rx="180" ry="160" fill="url(#core-glow)" filter="url(#glow-heavy)" opacity="0.75" />

  <!-- Ring 1: Outer Inclined Gold Brass Ring (Left tilt) -->
  <ellipse cx="960" cy="410" rx="115" ry="105" fill="none" stroke="url(#gold-ring-1)" stroke-width="9" transform="rotate(-28 960 410)" filter="url(#glow-soft)" />
  <ellipse cx="960" cy="410" rx="115" ry="105" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(-28 960 410)" opacity="0.7" />

  <!-- Ring 2: Vertical Gold Ring (Slight right tilt) -->
  <ellipse cx="960" cy="405" rx="90" ry="110" fill="none" stroke="url(#gold-ring-2)" stroke-width="8" transform="rotate(18 960 405)" />
  <ellipse cx="960" cy="405" rx="90" ry="110" fill="none" stroke="#fffbeb" stroke-width="2.5" transform="rotate(18 960 405)" opacity="0.8" />

  <!-- Ring 3: Inner Horizontal Equatorial Ring with Specular Highlight -->
  <ellipse cx="960" cy="420" rx="110" ry="40" fill="none" stroke="url(#gold-ring-1)" stroke-width="7" />
  <ellipse cx="960" cy="420" rx="110" ry="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Ring 4: Inner Oblique Ring -->
  <ellipse cx="960" cy="410" rx="70" ry="70" fill="none" stroke="url(#gold-ring-2)" stroke-width="6" transform="rotate(45 960 410)" />

  <!-- Central Suspended Polished Chrome Orb -->
  <circle cx="960" cy="410" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="952" cy="402" r="14" fill="#ffffff" opacity="0.8" filter="url(#glow-soft)" />
  <circle cx="950" cy="400" r="6" fill="#ffffff" />

  <!-- 3D Compass Needle Pivot Bar -->
  <polygon points="960,340 968,480 960,490 952,480" fill="url(#gold-ring-1)" filter="url(#glow-soft)" />
  <polygon points="960,340 964,480 960,490" fill="#ffffff" opacity="0.9" />
  <line x1="960" y1="330" x2="960" y2="495" stroke="#fef08a" stroke-width="2" />


  <!-- 6. Foreground Illuminated Chevron Pathway with Human Silhouette -->
  <!-- Ambient glow underneath the pathway -->
  <polygon points="1060,520 1880,980 1780,1080 960,540" fill="#fef9c3" opacity="0.15" filter="url(#ambient-bloom)" />

  <!-- Main Radiant Chevron Walkway Ribbon -->
  <path d="M 1060 520 L 1920 1000 L 1780 1080 L 980 545 Z" fill="url(#chevron-path-grad)" filter="url(#glow-soft)" />

  <!-- Outer Luminous Borders of Pathway -->
  <line x1="1060" y1="520" x2="1920" y2="1000" stroke="#ffffff" stroke-width="8" />
  <line x1="980" y1="545" x2="1780" y2="1080" stroke="#ffffff" stroke-width="8" />

  <!-- Chevron Segment Markings (>>> Pattern pointing toward compass) -->
  <!-- Chevron 1 (Near Compass) -->
  <path d="M 1080 540 L 1115 558 L 1090 575" stroke="#ca8a04" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1125 565 L 1160 585 L 1130 605" stroke="#ca8a04" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chevron 2 (Mid-distance) -->
  <path d="M 1190 605 L 1235 630 L 1195 655" stroke="#b45309" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1270 655 L 1320 685 L 1270 715" stroke="#b45309" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chevron 3 (Nearer) -->
  <path d="M 1360 715 L 1425 755 L 1360 790" stroke="#92400e" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1470 790 L 1545 835 L 1465 875" stroke="#92400e" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chevron 4 (Foreground) -->
  <path d="M 1590 870 L 1680 925 L 1580 970" stroke="#78350f" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 1720 955 L 1820 1020 L 1700 1070" stroke="#78350f" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 7. Human Silhouette Standing on Pathway Facing the Compass -->
  <!-- Person's shadow cast onto the radiant walkway -->
  <ellipse cx="1575" cy="830" rx="16" ry="6" fill="#000000" opacity="0.6" />

  <!-- Silhouette Figure (Stylized professional walking forward) -->
  <!-- Head -->
  <circle cx="1572" cy="742" r="7" fill="#0f172a" />
  <!-- Neck & Torso in tailored suit silhouette -->
  <path d="M 1568 750 L 1576 750 L 1580 782 L 1564 782 Z" fill="#0f172a" />
  <!-- Left Arm -->
  <line x1="1567" y1="752" x2="1562" y2="774" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <!-- Right Arm -->
  <line x1="1577" y1="752" x2="1582" y2="774" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <!-- Legs -->
  <line x1="1568" y1="782" x2="1566" y2="824" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="1576" y1="782" x2="1578" y2="824" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Subtle Rim Light on Figure from the Compass Glow -->
  <path d="M 1565 742 A 7 7 0 0 1 1572 735" stroke="#ffffff" stroke-width="1.5" fill="none" />
  <line x1="1564" y1="750" x2="1564" y2="782" stroke="#ffffff" stroke-width="1.5" />
  <line x1="1566" y1="782" x2="1564" y2="824" stroke="#ffffff" stroke-width="1.5" />

  <!-- 8. Atmospheric Sparkles & Light Particles -->
  <circle cx="960" cy="410" r="3" fill="#ffffff" filter="url(#glow-soft)" />
  <circle cx="920" cy="380" r="2" fill="#7dd3fc" />
  <circle cx="1010" cy="360" r="2.5" fill="#fde047" />
  <circle cx="890" cy="430" r="1.5" fill="#ffffff" />
  <circle cx="1040" cy="420" r="2" fill="#38bdf8" />
  <circle cx="1200" cy="340" r="2.5" fill="#ffffff" filter="url(#glow-soft)" />
  <circle cx="1340" cy="270" r="3" fill="#bae6fd" />
  <circle cx="1450" cy="220" r="2" fill="#ffffff" />
</svg>