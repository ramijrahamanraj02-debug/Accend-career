<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="ascend-brand-grad" x1="20" y1="220" x2="220" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007a82" />
      <stop offset="50%" stop-color="#008b8b" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="ascend-drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00828A" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <g filter="url(#ascend-drop)">
    <!-- Top-Right Descending Wing Blade (Starts high, extends low, terminates in chevron tail) -->
    <path
      d="M 124 16 L 144 16 L 216 166 L 192 216 L 176 188 L 196 156 Z"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Main Outer Triangle Left Leg -->
    <path
      d="M 108 44 L 126 44 L 46 178 L 28 178 Z"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Inner Parallel Diagonal Stripe -->
    <path
      d="M 126 44 L 144 44 L 64 178 L 46 178 Z"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Inner Upward Triangle -->
    <polygon
      points="126,98 158,162 94,162"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Triangle Base Crossbar -->
    <path
      d="M 46 162 L 176 162 L 186 178 L 36 178 Z"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Bottom Right Chevron / Lightning Tip -->
    <path
      d="M 192 216 L 182 234 L 164 204 L 176 188 Z"
      fill="url(#ascend-brand-grad)"
    />

    <!-- Bottom Horizontal Foundation Bar -->
    <path
      d="M 28 206 L 168 206 L 182 234 L 164 234 L 154 220 L 28 220 Z"
      fill="url(#ascend-brand-grad)"
    />
  </g>
</svg>